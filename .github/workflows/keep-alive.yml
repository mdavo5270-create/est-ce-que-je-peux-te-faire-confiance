name: Keep Render awake

# Appelle le site toutes les 5 minutes pour que Render (plan gratuit)
# ne l'endorme pas après 15 minutes d'inactivité.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 120 --retry 2 --retry-delay 10 \
            https://peux-te-faire-confiance.onrender.com/ || echo "Ping failed (the next run will retry)"
